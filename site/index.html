<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>線上工具箱</title><style>body{font:16px system-ui;background:#101827;color:#eef;max-width:850px;margin:35px auto;padding:15px}section{background:#202c40;padding:18px;border-radius:12px}textarea,input,select{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;background:#101827;color:white;border:1px solid #667;border-radius:7px}textarea{height:180px}button{padding:10px;margin:5px;background:#345c9d;color:white;border:0;border-radius:7px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><h1>🧰 線上工具箱</h1><p>純瀏覽器處理，無需伺服器及 API Key。</p><section><select id="mode"><option value="json">JSON 格式化</option><option value="min">JSON 壓縮</option><option value="enc">Base64 編碼（UTF-8）</option><option value="dec">Base64 解碼（UTF-8）</option><option value="urlenc">URL 編碼</option><option value="urldec">URL 解碼</option><option value="time">Unix 時間戳轉換</option><option value="mrs">Mihomo Domain TXT 轉換</option></select><textarea id="src" placeholder="在此輸入內容"></textarea><button onclick="run()">轉換</button><button onclick="navigator.clipboard.writeText(document.getElementById('result').textContent)">複製結果</button><pre id="result"></pre></section><p>支援 DOMAIN、DOMAIN-SUFFIX、DOMAIN-KEYWORD。IP 規則須獨立處理；本工具不會將內容上傳。</p><script>
const el=id=>document.getElementById(id);
function run(){let x=el('src').value,m=el('mode').value,y='';try{if(m==='json'||m==='min')y=JSON.stringify(JSON.parse(x),null,m==='json'?2:0);if(m==='enc'){let b=new TextEncoder().encode(x),s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode(...b.subarray(i,i+8192));y=btoa(s)}if(m==='dec')y=new TextDecoder('utf-8',{fatal:true}).decode(Uint8Array.from(atob(x.trim()),c=>c.charCodeAt(0)));if(m==='urlenc')y=encodeURIComponent(x);if(m==='urldec')y=decodeURIComponent(x);if(m==='time'){let n=x.trim()?Number(x.trim()):Date.now();if(!Number.isFinite(n))throw Error('無效時間戳');let d=new Date(x.trim()&&Math.abs(n)<1e11?n*1000:n);y=d.toISOString()+'\n'+d.toLocaleString()}if(m==='mrs'){let lines=[],bad=[];x.split(/\r?\n/).forEach((s,i)=>{s=s.trim();if(!s||s.startsWith('#'))return;let a=s.split(','),t=a[0].trim().toUpperCase(),v=(a[1]||'').trim();if(t==='DOMAIN-SUFFIX')s='+.'+v;else if(t==='DOMAIN')s='full:'+v;else if(t==='DOMAIN-KEYWORD')s='keyword:'+v;else if(a.length>1){bad.push(i+1);return}if(!/^(\+\.|full:|keyword:)[^\s,]+$/.test(s)){bad.push(i+1);return}lines.push(s)});y=[...new Set(lines)].join('\n')+(bad.length?'\n無法轉換行號：'+bad.join(', '):'')}}catch(e){y='錯誤：'+e.message}el('result').textContent=y}
</script></html>
